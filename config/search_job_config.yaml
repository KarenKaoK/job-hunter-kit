collection:
  provider: jobspy
  platforms:
    - linkedin
  locations:
    - Berlin
    - Munich
    - Europe
    - Netherlands
    - Czechia
    - Czech Republic
    - Prague
    - Brno
    - Ostrava
  search_terms:
    - machine learning engineer
    - data scientist
    - ai engineer
    - machine learning
    - MLops
  results_per_term: 50
  hours_old: 72
  linkedin_fetch_description: true
  translation:
    enabled: true
    provider: google
    target_language: zh-TW
    timeout_seconds: 60

include:
  title_keywords: []
  keywords: []
  locations:
    - Berlin
    - Munich
    - Europe
    - Netherlands
    - Czechia
    - Czech Republic
    - Czech
    - Prague
    - Praha
    - Brno
    - Ostrava
    - remote
  work_modes:
    - remote
    - hybrid

exclude:
  title_keywords:
    - manager
  keywords:
    - unpaid
    - internship
    - mindrift
    - Findr
    - Jobgether
    - HIBA GmbH
  language_requirements:
    - native german

sources:
  - linkedin
