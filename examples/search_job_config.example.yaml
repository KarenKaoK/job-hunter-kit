    - Berlin
    - Munich
    - Europe
    - Netherlands
    - remote
  work_modes:
    - remote
    - hybrid

exclude:
  title_keywords:
    - manager
  keywords:
    - unpaid
    - internship
    - mindrift
  language_requirements:
    - native german

sources:
  - linkedin
