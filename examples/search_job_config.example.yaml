collection:
  provider: jobspy
  platforms:
    - linkedin
  locations:
    - Berlin
    - Munich
    - Europe
    - Netherlands
  search_terms:
    - machine learning engineer
    - data scientist
    - ai engineer
    - machine learning
  results_per_term: 5
  hours_old: 72
  linkedin_fetch_description: true
